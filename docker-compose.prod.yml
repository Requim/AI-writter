services:
  database:
    container_name: novel-writer-database

  redis:
    container_name: novel-writer-redis

  backend:
    container_name: novel-writer-backend
    ports: !reset []

  research-api:
    container_name: novel-writer-research-api
    ports: !reset []

  research-worker:
    container_name: novel-writer-research-worker

  frontend:
    container_name: novel-writer-frontend
    build:
      context: ./writter_front
      dockerfile: Dockerfile
    ports: !override
      - "127.0.0.1:5173:80"
    networks:
      default:
      edge:
        aliases:
          - novel-writer-frontend

networks:
  edge:
    external: true
    name: unlimitworld_default
